  owns_data: []
  contract:
  - {doc: games/mini-warriors/index.html}
  source_of_truth: []
  reads: []
  does_not:
  - {job: listing the game on the landing page (games.json entry and card theme), owner: site}
  files:
  - {glob: games/mini-warriors/index.html, kind: code}
  - {glob: "games/mini-warriors/assets/*.js*", kind: generated, reason: "Vite build of harvey_games/mini-warriors"}
  - {glob: "games/mini-warriors/assets/*/**", kind: data}
  - {glob: "games/mini-warriors/icons/**", kind: data}
  - {glob: games/mini-warriors/manifest.json, kind: data}
